name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: lint, types, tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg 9 (static build) and Qt runtime libraries
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz" -o ffmpeg.tar.xz
          mkdir -p "$HOME/ffmpeg" && tar -xJf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (CPU PyTorch, ONNX Runtime CPU, GUI)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,onnx,gui,models]"
      - run: ruff check neuralframe tests benchmarks
      - run: mypy neuralframe
      - name: Tests (GPU and network tests skip themselves)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not gpu and not network"

  native:
    name: C++ module (GoogleTest)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cmake>=3.26" ninja
      - run: cmake -S . -B build/native-tests -DNEURALFRAME_BUILD_TESTS=ON -DNEURALFRAME_BUILD_PYTHON=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native-tests --config Release --parallel
      - run: ctest --test-dir build/native-tests -C Release --output-on-failure

  - id: realbasicvsr-x4
    kind: sr
    scale: 4
    input: recurrent
    window: 9
    architecture: realbasicvsr
    params: {mid_channels: 64, num_propagation_blocks: 20, num_cleaning_blocks: 20, dynamic_refine_thres: 255}
    pad_multiple: 4

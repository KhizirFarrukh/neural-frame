# NeuralFrame model registry.
#
# kind:         classical (resampling only) | sr (super-resolution network) | interpolation (frame generation)
# input:        single (one frame in, one frame out) | window (2r+1 frames → centre frame) | recurrent
# scale:        native upscale factor of the network (1 for classical models)
# window:       temporal window size for window/recurrent models (1 for single-frame)
# weights:      download URL, SHA256 and licence of the weight file (never committed to git)
# architecture: PyTorch implementation in neuralframe/inference/archs, or "spandrel" (the network is built
#               from the checkpoint by the spandrel library: transformer models such as HAT, DRCT, DAT)
#
# Fields used by automatic model choice (`-m auto`, neuralframe/models/advisor.py):
# content:      footage the model is trained for (live-action, animation)
# handles:      degradations it removes (noise, compression, blur); empty = expects clean input
# speed:        fast | medium | slow | very-slow (relative; transformers are an order of magnitude slower)
# rank:         relative output quality for its content (higher = better); calibrated with
#               benchmarks/quality.py where measured
# Other fields: backends (allowed inference backends), fp16 (false = bfloat16/FP32), memory_per_pixel
# (planning estimate, bytes per input pixel at 16-bit), bundled (shipped inside the Windows app).

models:
  # ---- classical ------------------------------------------------------------------------------------
  - id: lanczos
    kind: classical
    scale: 1
    resize_kernel: lanczos3
    description: Lanczos-3 resampling only (no neural network). Baseline and "no-op" upscale.
    recommended_content: [baseline]
    speed: fast
    licence: n/a

  - id: bicubic
    kind: classical
    scale: 1
    resize_kernel: bicubic
    description: Bicubic (Catmull-Rom) resampling only. Quality-evaluation baseline.
    recommended_content: [baseline]
    speed: fast
    licence: n/a

